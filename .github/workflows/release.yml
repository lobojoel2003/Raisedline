name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v1.0.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_NUMBER: ${{ github.run_number }}
  RAISEDLINE_CHANNEL: release

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install liblouis
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends liblouis-bin
      - run: npm ci
      - name: Tag matches the package version
        run: node scripts/check-version.mjs --tag "${{ steps.tag.outputs.tag }}"
      - name: Test
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Build
        run: npm run build
      - name: Package
        run: npm run release:package
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="${TAG#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          files=$(find release -maxdepth 1 -type f ! -name RELEASE_NOTES.md | sort)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
            gh release edit "$TAG" --notes-file release/RELEASE_NOTES.md --title "Raisedline $version"
          else
            gh release create "$TAG" $files --title "Raisedline $version" --notes-file release/RELEASE_NOTES.md --verify-tag $prerelease
          fi
      - name: Summary
        run: |
          {
            echo "### Released ${{ steps.tag.outputs.tag }} (build ${BUILD_NUMBER})"
            echo
            cat release/SHA256SUMS.txt | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
