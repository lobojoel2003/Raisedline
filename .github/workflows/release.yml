name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, e.g. v1.0.0. If the tag does not exist yet it is created on the commit this run builds.
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_NUMBER: ${{ github.run_number }}
  RAISEDLINE_CHANNEL: release

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::\"$TAG\" is not a version tag like v1.2.3"; exit 1 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Build the tagged commit if the tag exists, otherwise the commit this run was started on.
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install liblouis
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends liblouis-bin
      - run: npm ci
      - name: Tag matches the package version
        run: node scripts/check-version.mjs --tag "${{ steps.tag.outputs.tag }}"
      - name: Test
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Build
        run: npm run build
      - name: Package
        run: npm run release:package
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="${TAG#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          files=$(find release -maxdepth 1 -type f ! -name RELEASE_NOTES.md | sort)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
            gh release edit "$TAG" --notes-file release/RELEASE_NOTES.md --title "Raisedline $version"
          elif [ "${{ steps.tag.outputs.exists }}" = "true" ]; then
            gh release create "$TAG" $files --title "Raisedline $version" --notes-file release/RELEASE_NOTES.md --verify-tag $prerelease
          else
            # Creates the tag on the commit that was built and tested above.
            gh release create "$TAG" $files --title "Raisedline $version" --notes-file release/RELEASE_NOTES.md --target "$(git rev-parse HEAD)" $prerelease
          fi
      - name: Summary
        run: |
          {
            echo "### Released ${{ steps.tag.outputs.tag }} (build ${BUILD_NUMBER})"
            echo
            cat release/SHA256SUMS.txt | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
